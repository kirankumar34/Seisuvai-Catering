<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seisuvai Admin Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <!-- 1. LOGIN GATE -->
    <div id="loginGate" class="login-gate">
        <div class="login-card">
            <img src="images/seisuvai-logo.png" alt="Logo" class="login-logo">
            <h1 class="login-title">Admin Access</h1>
            <form id="loginForm">
                <input type="password" id="passcode" class="login-input" placeholder="Enter Passcode" required>
                <button type="submit" class="btn-login">Unlock Dashboard</button>
            </form>
            <p id="loginError" class="login-error">Invalid passcode</p>
        </div>
    </div>

    <!-- 2. DASHBOARD CONTAINER -->
    <div id="dashboard" class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="images/seisuvai-logo.png" alt="Logo" class="sidebar-logo">
                <h2>SEISUVAI<br>ADMIN</h2>
            </div>

            <nav style="flex: 1;">
                <div class="nav-item active" data-tab="overview">
                    <i class="fas fa-th-large"></i> Dashboard
                </div>
                <div class="nav-item" data-tab="bookings">
                    <i class="fas fa-calendar-check"></i> Bookings
                </div>
                <div class="nav-item" data-tab="custom-menus">
                    <i class="fas fa-utensils"></i> Custom Menus
                </div>
                <div class="nav-item" data-tab="live-stalls">
                    <i class="fas fa-store"></i> Live Stalls
                </div>
                <div class="nav-item" data-tab="reviews">
                    <i class="fas fa-star"></i> Reviews
                </div>
            </nav>

            <div class="nav-item logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <button class="mobile-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <h1 class="page-title" id="pageTitle">Overview</h1>
                <div class="date-display" id="currentDate">Mock Date</div>
            </div>

            <!-- SECTION: Overview -->
            <div id="overview" class="section active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Enquiries</div>
                        <div class="stat-value" id="statTotal">0</div>
                    </div>
                    <div class="stat-card gold">
                        <div class="stat-label">Pending</div>
                        <div class="stat-value" id="statPending">0</div>
                    </div>
                    <div class="stat-card blue">
                        <div class="stat-label">This Month</div>
                        <div class="stat-value" id="statMonth">0</div>
                    </div>
                    <div class="stat-card green">
                        <div class="stat-label">Reviews</div>
                        <div class="stat-value" id="statReviews">0</div>
                    </div>
                </div>

                <h3 style="margin-bottom: 1rem; color: var(--maroon-dark);">Recent Activity</h3>
                <div class="table-container">
                    <table id="recentTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recentTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- SECTION: Bookings -->
            <div id="bookings" class="section">
                <div id="bookingsList"></div>
            </div>

            <!-- SECTION: Custom Menus -->
            <div id="custom-menus" class="section">
                <div id="customMenusList"></div>
            </div>

            <!-- SECTION: Live Stalls -->
            <div id="live-stalls" class="section">
                <div id="liveStallsList"></div>
            </div>

            <!-- SECTION: Reviews -->
            <div id="reviews" class="section">
                <div id="reviewsList"
                    style="display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
                </div>
            </div>

        </main>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="login-gate" style="display: none; background: rgba(0,0,0,0.8);">
        <div class="login-card" style="max-width: 600px; text-align: left; position: relative;">
            <button id="closeModal"
                style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h2 id="modalTitle" style="font-family: 'Cinzel', serif; margin-bottom: 1rem; color: var(--maroon-dark);">
                Details</h2>
            <div id="modalContent" style="max-height: 70vh; overflow-y: auto;">
                <!-- Content injected via JS -->
            </div>
            <div style="margin-top: 1.5rem; text-align: right;">
                <button class="btn-login" style="width: auto; padding: 0.5rem 1.5rem;"
                    onclick="document.getElementById('detailsModal').style.display='none'">Close</button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="js/admin.js"></script>
</body>

</html>
